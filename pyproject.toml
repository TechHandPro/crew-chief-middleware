[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "crew-chief-middleware"
version = "0.1.0"
description = "Turn vendor OpenAPI specs into runnable MCP servers so agents call business APIs instead of driving a browser."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "openapi", "middleware", "agents", "codegen"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "PyYAML>=6.0",
  "httpx>=0.27",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[project.scripts]
openapi_to_mcp = "openapi_to_mcp.cli:main"
openapi-to-mcp = "openapi_to_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_to_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
